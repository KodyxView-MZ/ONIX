<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ONIX · Acesso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        /* elementos decorativos */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(0,0,0,0.02) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0,0,0,0.01) 0%, transparent 70%);
            pointer-events: none;
        }

        .card {
            background: #ffffff;
            border-radius: 2rem;
            width: 100%;
            max-width: 480px;
            padding: 2.5rem 2rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.02);
            position: relative;
            z-index: 1;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        /* cabeçalho com decoração */
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .logo h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: #000000;
            margin-bottom: 0.5rem;
        }

        .logo-sub {
            font-size: 0.75rem;
            color: #888888;
            letter-spacing: 0.3px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .logo-sub::before,
        .logo-sub::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e0e0e0, transparent);
        }

        .logo-sub span {
            background: #f8f8f8;
            padding: 0 0.75rem;
        }

        /* elementos decorativos nas laterais */
        .decor-line {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin: 1rem 0 1.5rem;
        }

        .decor-dot {
            width: 4px;
            height: 4px;
            background: #d0d0d0;
            border-radius: 50%;
        }

        .tabs {
            display: flex;
            gap: 0.75rem;
            background: #f5f5f5;
            padding: 0.4rem;
            border-radius: 3rem;
            margin-bottom: 2rem;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.75rem 0;
            border-radius: 2.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #888888;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tab-btn svg {
            width: 18px;
            height: 18px;
            stroke: #888888;
            stroke-width: 1.5;
            fill: none;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .tab-btn.active svg {
            stroke: #000000;
        }

        .form-container {
            display: block;
        }

        .form-hidden {
            display: none;
        }

        .input-group {
            margin-bottom: 1.3rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #555555;
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }

        label svg {
            width: 16px;
            height: 16px;
            stroke: #888888;
            stroke-width: 1.5;
            fill: none;
        }

        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #e8e8e8;
            border-radius: 1rem;
            padding: 0.9rem 1.2rem;
            font-size: 0.95rem;
            color: #000000;
            transition: all 0.2s;
            outline: none;
            font-weight: 450;
        }

        input:focus {
            border-color: #000000;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.03);
        }

        input::placeholder {
            color: #cccccc;
            font-weight: 400;
        }

        .btn-primary {
            width: 100%;
            background: #000000;
            border: none;
            border-radius: 1rem;
            padding: 0.95rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
            stroke: white;
            stroke-width: 1.5;
            fill: none;
        }

        .btn-primary:hover {
            background: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 0.8rem;
            padding: 0.7rem;
            border-radius: 1rem;
            background: #fafafa;
            color: #666666;
        }

        .error-msg {
            color: #d32f2f;
            background: #ffefef;
        }

        .success-msg {
            color: #2e7d32;
            background: #eff7ef;
        }

        .info-box {
            background: #fafafa;
            border-radius: 1rem;
            padding: 1rem;
            margin-top: 1.5rem;
            text-align: center;
            border: 1px solid #f0f0f0;
        }

        .info-box p {
            font-size: 0.7rem;
            color: #999999;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .info-box svg {
            width: 14px;
            height: 14px;
            stroke: #aaaaaa;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #bbbbbb;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        footer svg {
            width: 12px;
            height: 12px;
            stroke: #cccccc;
        }

        @media (max-width: 500px) {
            .card {
                padding: 1.8rem 1.5rem;
            }
            .logo h1 { 
                font-size: 2.2rem; 
            }
            .tab-btn {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>ONIX</h1>
        <div class="logo-sub">
            <span>Sua Loja online · E-commerce</span>
        </div>
    </div>
    
    <div class="decor-line">
        <div class="decor-dot"></div>
        <div class="decor-dot"></div>
        <div class="decor-dot"></div>
        <div class="decor-dot"></div>
        <div class="decor-dot"></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabLoginBtn">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
            Acessar
        </button>
        <button class="tab-btn" id="tabRegisterBtn">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <line x1="20" y1="8" x2="20" y2="14" />
                <line x1="23" y1="11" x2="17" y2="11" />
            </svg>
            Criar conta
        </button>
    </div>

    <!-- FORMULÁRIO LOGIN -->
    <div id="loginForm" class="form-container">
        <div class="input-group">
            <label>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                    <line x1="12" y1="18" x2="12" y2="18" stroke-width="2" />
                </svg>
                Número de celular
            </label>
            <input type="tel" id="loginPhone" placeholder="+258 84 123 4567" autocomplete="tel">
        </div>
        <div class="input-group">
            <label>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                Senha
            </label>
            <input type="password" id="loginPassword" placeholder="··············">
        </div>
        <button class="btn-primary" id="doLoginBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
            Entrar na ONIX
        </button>
        <div id="loginMessage" class="message"></div>
    </div>

    <!-- FORMULÁRIO CADASTRO -->
    <div id="registerForm" class="form-container form-hidden">
        <div class="input-group">
            <label>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                Nome completo
            </label>
            <input type="text" id="regName" placeholder="Amélia Langa">
        </div>
        <div class="input-group">
            <label>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                    <line x1="12" y1="18" x2="12" y2="18" stroke-width="2" />
                </svg>
                Número de celular
            </label>
            <input type="tel" id="regPhone" placeholder="+258 84 123 4567">
        </div>
        <div class="input-group">
            <label>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                Senha
            </label>
            <input type="password" id="regPassword" placeholder="mínimo 6 caracteres">
        </div>
        <div class="input-group">
            <label>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
                Confirmar senha
            </label>
            <input type="password" id="regConfirm" placeholder="digite novamente">
        </div>
        <button class="btn-primary" id="doRegisterBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <line x1="20" y1="8" x2="20" y2="14" />
                <line x1="23" y1="11" x2="17" y2="11" />
            </svg>
            Criar conta
        </button>
        <div id="registerMessage" class="message"></div>
    </div>

    <div class="info-box">
        <p>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            Acesse sua dashboard e crie sua loja Online
        </p>
    </div>

    <footer>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <line x1="8" y1="10" x2="16" y2="10" />
        </svg>
        ambiente seguro · ONIX
    </footer>
</div>

<script>
    const STORAGE_KEY = "onix_users";

    function getUsers() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try {
            return JSON.parse(raw);
        } catch(e) {
            return [];
        }
    }

    function saveUsers(users) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
    }

    function registerUser(name, phone, password) {
        let users = getUsers();
        const exists = users.some(u => u.phone === phone);
        if (exists) return { success: false, message: "Número já cadastrado. Faça login." };
        
        const newUser = {
            id: Date.now().toString(),
            name: name.trim(),
            phone: phone,
            password: password,
            createdAt: new Date().toISOString()
        };
        users.push(newUser);
        saveUsers(users);
        return { success: true, message: "Conta criada com sucesso! Agora faça login." };
    }

    function loginUser(phone, password) {
        const users = getUsers();
        const user = users.find(u => u.phone === phone && u.password === password);
        if (user) {
            const session = {
                userId: user.id,
                name: user.name,
                phone: user.phone,
                loggedAt: new Date().toISOString()
            };
            localStorage.setItem("onix_session", JSON.stringify(session));
            return { success: true, message: "Login efetuado. Redirecionando..." };
        } else {
            return { success: false, message: "Celular ou senha incorretos." };
        }
    }

    function redirectToDashboard() {
        window.location.href = "/dashboard/index.html";
    }

    const loginContainer = document.getElementById('loginForm');
    const registerContainer = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLoginBtn');
    const tabRegister = document.getElementById('tabRegisterBtn');
    const loginMsgDiv = document.getElementById('loginMessage');
    const registerMsgDiv = document.getElementById('registerMessage');
    const loginPhone = document.getElementById('loginPhone');
    const loginPassword = document.getElementById('loginPassword');
    const doLogin = document.getElementById('doLoginBtn');
    const regName = document.getElementById('regName');
    const regPhone = document.getElementById('regPhone');
    const regPassword = document.getElementById('regPassword');
    const regConfirm = document.getElementById('regConfirm');
    const doRegister = document.getElementById('doRegisterBtn');

    function setActiveTab(tab) {
        if (tab === 'login') {
            loginContainer.classList.remove('form-hidden');
            registerContainer.classList.add('form-hidden');
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginMsgDiv.innerHTML = '';
            loginMsgDiv.className = 'message';
        } else {
            loginContainer.classList.add('form-hidden');
            registerContainer.classList.remove('form-hidden');
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerMsgDiv.innerHTML = '';
            registerMsgDiv.className = 'message';
        }
    }

    tabLogin.addEventListener('click', () => setActiveTab('login'));
    tabRegister.addEventListener('click', () => setActiveTab('register'));

    doLogin.addEventListener('click', () => {
        const phone = loginPhone.value.trim();
        const password = loginPassword.value.trim();

        if (!phone || !password) {
            loginMsgDiv.innerHTML = 'Preencha celular e senha.';
            loginMsgDiv.className = 'message error-msg';
            return;
        }

        const result = loginUser(phone, password);
        if (result.success) {
            loginMsgDiv.innerHTML = result.message;
            loginMsgDiv.className = 'message success-msg';
            setTimeout(() => {
                redirectToDashboard();
            }, 1200);
        } else {
            loginMsgDiv.innerHTML = result.message;
            loginMsgDiv.className = 'message error-msg';
        }
    });

    doRegister.addEventListener('click', () => {
        const name = regName.value.trim();
        const phone = regPhone.value.trim();
        const password = regPassword.value;
        const confirm = regConfirm.value;

        if (!name || !phone || !password || !confirm) {
            registerMsgDiv.innerHTML = 'Todos os campos são obrigatórios.';
            registerMsgDiv.className = 'message error-msg';
            return;
        }

        if (password.length < 6) {
            registerMsgDiv.innerHTML = 'A senha deve ter pelo menos 6 caracteres.';
            registerMsgDiv.className = 'message error-msg';
            return;
        }

        if (password !== confirm) {
            registerMsgDiv.innerHTML = 'As senhas não coincidem.';
            registerMsgDiv.className = 'message error-msg';
            return;
        }

        if (!phone.match(/^[\+\d\s\-\(\)]{8,}$/)) {
            registerMsgDiv.innerHTML = 'Informe um número de celular válido (ex: +258 84 1234567).';
            registerMsgDiv.className = 'message error-msg';
            return;
        }

        const result = registerUser(name, phone, password);
        if (result.success) {
            registerMsgDiv.innerHTML = result.message;
            registerMsgDiv.className = 'message success-msg';
            regName.value = '';
            regPhone.value = '';
            regPassword.value = '';
            regConfirm.value = '';
            setTimeout(() => {
                setActiveTab('login');
                registerMsgDiv.innerHTML = '';
            }, 1500);
        } else {
            registerMsgDiv.innerHTML = result.message;
            registerMsgDiv.className = 'message error-msg';
        }
    });

    function checkExistingSession() {
        const session = localStorage.getItem("onix_session");
        if (session) {
            try {
                const sessData = JSON.parse(session);
                if (sessData.userId) {
                    window.location.href = "/dashboard/index.html";
                }
            } catch(e) {}
        }
    }
    checkExistingSession();
</script>
</body>
  </html>
